<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stay Focused - FocusBlock</title>
    <link rel="stylesheet" href="blocked.css">
  </head>
  <body>
    <main class="card" aria-live="polite">
      <div class="stop-sign" aria-hidden="true">🚫</div>
      <p class="eyebrow">FOCUSBLOCK</p>
      <h1>Stay Focused</h1>
      <p class="description">
        This website is currently blocked during your FocusBlock session.
      </p>
      <div id="countdown" class="countdown">--:--</div>
      <p id="session-status" class="session-status">Focus Mode is active.</p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
